esphome:
  name: prusa-cam

esp32:
  variant: esp32s3

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

psram:
  mode: QUAD
  speed: 80MHz

esp32_camera:
  id: printer_cam
  name: Drucker Kamera
  external_clock:
    pin: GPIO15
    frequency: 20MHz
  i2c_pins:
    sda: GPIO16
    scl: GPIO17
  data_pins: [GPIO5, GPIO18, GPIO19, GPIO21, GPIO36, GPIO39, GPIO34, GPIO35]
  vsync_pin: GPIO06
  href_pin: GPIO07
  pixel_clock_pin: GPIO13
  power_down_pin: GPIO0
  resolution: 1600X1200
  jpeg_quality: 10

web_server:   # letzter Snapshot zusätzlich abrufbar unter http://<device>/
  port: 80

http_request:

external_components:
  - source:
      type: local
      path: components

prusa_link_timelapse:
  camera: printer_cam
  host: 192.168.1.42        # IP des Druckers (Prusa Link)
  username: maker           # Prusa-Link-Zugangsdaten (Drucker-Display -> Settings)
  password: !secret prusa_password
  poll_interval: 2s
  layer_tolerance: 0.01     # Mindest-Z-Delta für "Layer-Wechsel" (mm)
  save_to_sd: true
  webhook_url: http://homeassistant.local:8123/api/webhook/prusa_timelapse
